name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    name: 타입 검사·코드 스타일
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  test:
    name: 테스트
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: savetime
          POSTGRES_PASSWORD: savetime_local
          POSTGRES_DB: savetime
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U savetime"
          --health-interval 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  crosscheck:
    name: 설계 대조
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - run: python tools/crosscheck.py

  gitleaks:
    name: 비밀키 검사
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 받은 실행 파일을 버전별로 캐시에 둔다. GitHub 다운로드가 504 로 막혀도(2026-11-08 #62~#64) 캐시가 있으면 검사가 돈다
      - name: gitleaks 캐시
        id: gitleaks-cache
        uses: actions/cache@v4
        with:
          path: gitleaks
          key: gitleaks-${{ env.GITLEAKS_VERSION }}-linux-x64
      - name: gitleaks 설치
        if: steps.gitleaks-cache.outputs.cache-hit != 'true'
        # 캐시가 없을 때만 받는다. 잠깐 쉬었다가 5번까지 다시 받고, 체크섬이 맞아야 쓴다
        run: |
          curl -fsSL --retry 5 --retry-delay 5 --retry-connrefused "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          curl -fsSL --retry 5 --retry-delay 5 --retry-connrefused "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz$" checksums.txt | sed 's/gitleaks_.*/gitleaks.tar.gz/' | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - run: ./gitleaks git --redact --no-banner

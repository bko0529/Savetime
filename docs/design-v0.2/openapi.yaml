components:
  schemas:
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
          - ok
          - error
        checks:
          type: object
          properties:
            db:
              type: string
              enum:
              - ok
              - error
            redis:
              type: string
              enum:
              - ok
              - error
      required:
      - status
      - checks
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: 기계용 오류 코드 (오류 코드표)
            message:
              type: string
              description: 사람이 읽는 한국어 메시지
            details:
              type: object
              properties: {}
              description: 코드별 추가 정보. VERSION_CONFLICT·INVALID_TRANSITION → current(최신
                Transport 또는 요청 상태), ALREADY_RESPONDED → respondedBy·pcName, PC_LIMIT_REACHED
                → pcs[{id, name, lastUsedAt}], ACTIVE_TRANSPORT_EXISTS → activeTransport{id,status,hospitalName},
                OVER_APPROVAL_CONFIRM_REQUIRED → validApprovals·erAvail, VALIDATION_FAILED
                → fields[]
              nullable: true
          required:
          - code
          - message
      required:
      - error
    LatLng:
      type: object
      properties:
        lat:
          type: number
        lng:
          type: number
      required:
      - lat
      - lng
    Tokens:
      type: object
      properties:
        accessToken:
          type: string
          description: 15분 유효 JWT
        refreshToken:
          type: string
          description: 로그인부터 최대 14시간(근무 단위, SER-007). 서버에 해시만 저장해 폐기 가능(SER-016).
            재발급할 때마다 새 값으로 바뀌고 예전 값은 다시 못 쓴다
    Me:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        rank:
          type: string
        agency:
          type: string
          description: 소방서 이름
        safetyCenter:
          type: string
        status:
          type: string
          enum:
          - pending
          - approved
          - rejected
          - suspended
        rejectReason:
          type: string
          enum:
          - photo_unclear
          - info_mismatch
          - agency_unverified
          - etc
          - photo_expired
          description: 반려 사유 (rejected일 때)
          nullable: true
        appliedAt:
          type: string
          format: date-time
          description: 가입 신청(재신청) 시각. 신청 없이 만든 계정(개발용)은 null
          nullable: true
        mustChangePassword:
          type: boolean
        teamId:
          type: integer
          description: 근무 중인 팀, 없으면 null
          nullable: true
        hasActiveTransport:
          type: boolean
          description: 팀에 진행 중 이송 (근무 종료 확인 판단, SFR-113)
    Member:
      type: object
      properties:
        paramedicId:
          type: integer
        name:
          type: string
        rank:
          type: string
        role:
          type: string
          enum:
          - driver
          - care
        isMe:
          type: boolean
    Team:
      type: object
      properties:
        id:
          type: integer
        code:

          description: 공공 데이터 병원 좌표 (SFR-145 입구 지정 지도의 처음 가운데). 대한민국 밖·없으면 null
          allOf:
          - $ref: '#/components/schemas/LatLng'
          nullable: true
        entrance:
          description: 응급실 입구 좌표 (SFR-145). null 이면 '입구 좌표 없음', 도착 판정은 location 으로
          allOf:
          - $ref: '#/components/schemas/LatLng'
          nullable: true
    HospitalStat:
      type: object
      properties:
        hospitalId:
          type: integer
        name:
          type: string
        responseRate:
          type: number
        avgResponseSec:
          type: integer
        topRejectReason:
          type: string
          enum:
          - er_bed
          - or_room
          - ward
          - icu
          - no_specialist
          - equipment
          - etc
          nullable: true
        approvalCancelRate:
          type: number
        unacceptableCount:
          type: integer
        avgRequestToFirstApprovalSec:
          type: integer
        sampleTooSmall:
          type: boolean
          description: 요청 10건 미만
        rejectSpike:
          type: boolean
          description: 최근 7일 거절률이 30일보다 20%p 이상 높음
        rejectBySource:
          type: object
          description: 거절 사유 건수, 출처별 (SFR-106)
          properties:
            hospitalWeb:
              type: object
              additionalProperties:
                type: integer
            paused:
              type: object
              additionalProperties:
                type: integer
            phoneCheck:
              type: object
              additionalProperties:
                type: integer
            approvalCancelled:
              type: object
              additionalProperties:
                type: integer
            unacceptable:
              type: object
              additionalProperties:
                type: integer
    JournalDraft:
      type: object
      description: 구급활동일지 초안의 자동 항목 (부록 G). 서버는 따로 저장하지 않고 이송 건 기록에서 그때 만든다. 환자 성명·주소
        등은 없음 — 앱이 단말에서만 입력·보관 (DAR-015)
      properties:
        transportId:
          type: string
          format: uuid
        agencyName:
          type: string
        safetyCenter:
          type: string
        crew:
          type: array
          description: 이송이 진행되는 동안 팀에 있었던 대원 (끝난 뒤 들어온 사람은 빼고)
          items:
            type: object
            properties:
              name:
                type: string
              rank:
                type: string
              role:
                type: string
                enum:
                - driver
                - care
        departedAt:
          type: string
          format: date-time
          nullable: true
        arrivedAt:
          type: string
          format: date-time
          nullable: true
        distanceKm:
          type: number
          nullable: true
          description: 이동 거리. 위치 기록이 없으면(위치 미동의·통신 두절 중 도착) null → 대원이 직접 입력
        sex:
          type: string
          enum:
          - M
          - F
          nullable: true
          description: 확인 불가면 null (대원이 직접 입력)
        ageBand:
          type: string
          nullable: true
        chiefComplaint:
          type: string
          nullable: true
        onsetAt:
          type: string
          nullable: true
        consciousness:
          type: string
          enum:
          - A
          - V
          - P
          - U
          nullable: true
          description: 앱 평가의 의식 수준(alert·verbal·pain·unresponsive)을 AVPU로. 확인 불가면 null
        vitals:
          type: object
          description: 마지막으로 보낸 평가의 활력징후. 없는 값은 null. 혈압은 '150/90'을 나눈 값
          properties:
            sbp:
              type: integer
              nullable: true
            dbp:
              type: integer
              nullable: true
            pulse:
              type: integer
              nullable: true
            resp:
              type: integer
              nullable: true
            temp:
              type: number
              nullable: true
            spo2:
              type: integer
              nullable: true
            glucose:
              type: integer
              nullable: true
        history:
          type: string
          nullable: true
        ktas:
          type: integer
          nullable: true
        hospitalName:
          type: string
          nullable: true
          description: 이송 기관 = 도착한 확정 병원. 취소된 건은 null
        reTransferReasons:
          type: array
          items:
            type: object
            properties:
              hospitalName:
                type: string
              reason:
                type: string
                enum:
                - er_bed
                - or_room
                - ward
                - icu
                - no_specialist
                - equipment
                - etc
          description: 재이송 사유. 이 이송 건에서 병원 거절·승인 취소·수용 불가와 전화 확인 거절 (잠시 요청 중지 자동 거절은 뺌)
        notTransportedReason:
          type: string
          enum:
          - refused
          - death
          - on_scene
          - other_agency
          - etc
          - system_end
          nullable: true
          description: 미이송 사유. 대원이 취소 때 고른 값, 서버가 끝낸 취소(활동 없음·근무 종료 등)는 system_end, 도착했거나 고르지 않았으면 null
        notTransportedText:
          type: string
          nullable: true
          description: "미이송 사유 '기타' 글"

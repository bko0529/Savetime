components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: 기계용 오류 코드 (오류 코드표)
            message:
              type: string
              description: 사람이 읽는 한국어 메시지
            details:
              type: object
              properties: {}
              description: 코드별 추가 정보. VERSION_CONFLICT·INVALID_TRANSITION → current(최신 Transport 또는 요청 상태), ALREADY_RESPONDED → respondedBy·pcName, PC_LIMIT_REACHED → pcs[], ACTIVE_TRANSPORT_EXISTS → activeTransport{id,status,hospitalName},
                OVER_APPROVAL_CONFIRM_REQUIRED → validApprovals·erAvail, VALIDATION_FAILED → fields[]
              nullable: true
          required:
          - code
          - message
      required:
      - error
    LatLng:
      type: object
      properties:
        lat:
          type: number
        lng:
          type: number
      required:
      - lat
      - lng
    Tokens:
      type: object
      properties:
        accessToken:
          type: string
          description: 15분 유효 JWT
        refreshToken:
          type: string
          description: 30일 유효, 서버 폐기 가능 (SER-016)
    Me:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        rank:
          type: string
        agency:
          type: string
          description: 소방서 이름
        safetyCenter:
          type: string
        status:
          type: string
          enum:
          - pending
          - approved
          - rejected
          - suspended
        rejectReason:
          type: string
          enum:
          - photo_unclear
          - info_mismatch
          - agency_unverified
          - etc
          - photo_expired
          description: 반려 사유 (rejected일 때)
          nullable: true
        appliedAt:
          type: string
          format: date-time
          description: 가입 신청(재신청) 시각
        mustChangePassword:
          type: boolean
        hasPin:
          type: boolean
        teamId:
          type: integer
          description: 근무 중인 팀, 없으면 null
          nullable: true
        hasActiveTransport:
          type: boolean
          description: 팀에 진행 중 이송 (앱 잠금 건너뛰기 판단, SFR-150)
    Member:
      type: object
      properties:
        paramedicId:
          type: integer
        name:
          type: string
        rank:
          type: string
        role:
          type: string
          enum:
          - driver
          - care
        isMe:
          type: boolean
    Team:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
          description: 4자리 팀 코드
        qrToken:
          type: string
        members:
          type: array
          items:
            $ref: '#/components/schemas/Member'
        maxMembers:
          type: integer
          example: 4
    OnDutyParamedic:
      type: object
      properties:
        paramedicId:
          type: integer
        name:
          type: string
        rank:
          type: string
        safetyCenter:
          type: string
        employeeNoTail:
          type: string
          description: 사번 끝 4자리 (동명이인 구분)
        myMemo:
          type: string
          description: 나만 보는 메모 (SFR-143)
          nullable: true
        onDuty:
          type: boolean
        inTeam:
          type: boolean
          description: 이미 다른 팀 → 초대 불가
        inviteStatus:
          type: string
          enum:
          - none
          - sent
          - accepted
    Assessment:
      type: object
      properties:
        chiefComplaint:
          type: string
          description: 주 증상 (직접 입력, 필수)
          maxLength: 100
        symptomCode:
          type: string
          description: 증상 버튼 코드 S01~S16, 안 골랐으면 null
          pattern: ^S\d{2}$
          nullable: true
        sex:
          type: string
          enum:
          - M
          - F
          - U
          description: U = 확인 불가
        ageBand:
          type: string
          description: '예: 60s, under1, 1-14, 15-19, 90plus'
        consciousness:
          type: string
          enum:
          - alert
          - verbal
          - pain
          - unresponsive
          - unknown
        bp:
          type: string
          description: '예: 160/95, 또는 unknown'
        pulse:
          type: integer
          nullable: true
        resp:
          type: integer
          nullable: true
        spo2:
          type: integer
          nullable: true
        painSite:
          type: string
          nullable: true
          maxLength: 30
        painScore:
          type: integer
          minimum: 0
          maximum: 10
          nullable: true
        onset:
          type: string
          nullable: true
        trauma:
          type: string
          enum:
          - 'yes'
          - 'no'
          - unknown
        traumaCause:
          type: string
          enum:
          - traffic
          - fall_high
          - fall
          - penetrating
          - burn
          - etc
          nullable: true
        history:
          type: string
          nullable: true
        temp:
          type: number
          nullable: true
        glucose:
          type: integer
          nullable: true
        ktas:
          type: integer
          minimum: 1
          maximum: 5
          nullable: true
        unknownFields:
          type: array
          items:
            type: string
          description: '''확인 불가''로 보낸 항목 이름'
      required:
      - chiefComplaint
      description: 환자 평가 (SFR-108). 이름·주민번호·연락처 필드는 없음 (SER-012)
    Round:
      type: object
      properties:
        roundNo:
          type: integer
        kind:
          type: string
          enum:
          - first
          - expand
          - re_request
          - dest_change
        radiusKm:
          type: integer
          enum:
          - 10
          - 20
          - 30
          - 40
        sentAt:
          type: string
          format: date-time
        respondUntil:
          type: string
          format: date-time
          description: sentAt + 2분 (서버 시각)
        approvalValidUntil:
          type: string
          format: date-time
          description: sentAt + 5분
        targetCount:
          type: integer
          description: 요청을 보낸 병원 수
        deliveredCount:
          type: integer
          description: '''받았음''을 돌려준 병원 수'
        deliveryFinal:
          type: boolean
          description: 5초 판정 끝
    AppHospitalRequest:
      type: object
      properties:
        id:
          type: integer
        hospitalId:
          type: integer
        hospitalName:
          type: string
        lat:
          type: number
          description: 지도 표시 (SFR-149)
        lng:
          type: number
        status:
          type: string
          enum: &id019
          - waiting
          - delivery_failed
          - approved
          - rejected
          - expired
          - closed
          - confirmed
          - arrived
          - unacceptable
        closeReason:
          type: string
          enum: &id020
          - other_hospital
          - fallback
          - cancelled
          - expired_approval
          - approval_cancelled
          - dest_changed
          nullable: true
        etaMin:
          type: integer
        etaSource:
          type: string
          enum:
          - straight
          - route
          description: 직선 추정 → 길찾기로 갱신 (SFR-129)
        erBeds:
          type: string
          description: '예: 4/10'
        memo:
          type: string
          description: 병원 승인 메모
          nullable: true
        extraMemo:
          type: string
          description: 확정 뒤 추가 메모 (SFR-140)
          nullable: true
        reason:
          type: string
          enum: *id017
          description: 거절·승인 취소 사유
          nullable: true
        reasonText:
          type: string
          description: 기타 사유 글
          nullable: true
        approvedAt:
          type: string
          format: date-time
          nullable: true
        isClosest:
          type: boolean
          description: 승인 병원 중 가장 가까움
        prevApprovedRecheck:
          type: boolean
          description: 직전 승인 · 재확인 (SFR-156)
        version:
          type: integer
          description: hospital_request.version
      description: 대원 앱에서 보는 병원 요청 1건 (환자 정보 없음)
    Transport:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - requesting
          - fallback
          - phone_check
          - moving
          - arrived
          - cancelled
          description: 상태 전이표 v0.2
        version:
          type: integer
          description: transport 행이 바뀔 때마다 +1. 바꾸는 요청에 같이 보냄 (SFR-160)
        serverNow:
          type: string
          format: date-time
          description: 응답 시점 서버 시각 → 남은 시간 계산 기준 (SFR-110)
        requestRadiusKm:
          type: integer
          enum:
          - 10
          - 20
          - 30
          - 40
        fallbackRadiusKm:
          type: integer
          enum:
          - 10
          - 20
          - 30
          - 40
        fallbackReason:
          type: string
          enum:
          - no_target
          - offline
          - all_rejected
          - expired_no_approval
          - none_delivered
          - approvals_cancelled
          - user
          - approval_window
          - phone_rejected_last
          - phone_dismissed
          nullable: true
        currentRound:
          allOf:
          - $ref: '#/components/schemas/Round'
          nullable: true
        requests:
          type: array
          items:
            $ref: '#/components/schemas/AppHospitalRequest'
          description: 현재 회차 + 확정 요청. 승인은 승인 시각 순 (SFR-110)
        phoneTarget:
          type: object
          properties:
            hospitalId:
              type: integer
            name:
              type: string
            erPhone:
              type: string
          description: 전화 확인 중인 병원 (phone_check일 때)
          nullable: true
        confirmedHospital:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            memo:
              type: string
              nullable: true
            extraMemo:
              type: string
              nullable: true
            entrance:
              $ref: '#/components/schemas/LatLng'
            requestStatus:
              type: string
              enum: *id019
            closeReason:
              type: string
              enum: *id020
              nullable: true
          description: 이동 중 목적지. requestStatus=closed·closeReason=approval_cancelled면 '다시 요청' 버튼
          nullable: true
        canReRequest:
          type: boolean
          description: 확정 병원이 승인 취소함 → 다시 요청 가능 (부록 A20)
        destinationChangeUsed:
          type: boolean
          description: 목적지 변경 1번 사용 (SFR-077)
        navDeviceId:
          type: string
          description: 경로 안내 담당 단말
          nullable: true
        etaMin:
          type: integer
          description: 서버가 1분마다 다시 계산
          nullable: true
        departedAt:
          type: string
          format: date-time
          description: 처음 출발 시각 (SFR-036)
          nullable: true
        lastSentAssessmentSeq:
          type: integer
        pendingChanges:
          type: integer
          description: '''변경 사항 보내기(n)''의 n'
        excludedHospitalIds:
          type: array
          items:
            type: integer
        locationConsent:
          type: boolean
        address:
          type: string
          description: 위치 미동의 건 주소
          nullable: true
        offlineCreated:
          type: boolean
          description: 통신 두절 중 만든 건
        createdAt:
          type: string
          format: date-time
    HospitalCard:
      type: object
      properties:
        id:

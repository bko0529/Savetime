  /transports/{transportId}/phone-checks:
    post:
      tags:
      - 4. 이송 (대원 앱 · 핵심)
      summary: 전화 확인 결과 기록
      description: "accepted → moving / no_answer·skipped(사유) → moving / rejected\
        \ → 제외 병원 추가 후 다음 후보가 있으면 phone_check 유지(phoneTarget 바뀜), 없으면 fallback / dismissed(결과\
        \ 미선택으로 닫기) → fallback. 통신 두절 중 기록은 /transports/sync로.\n\n**요구사항**: SFR-032,\
        \ SFR-033, SFR-034, SFR-074, SFR-075  \n**화면**: S-08 전화 확인  \n**오류 코드**: NOT_FOUND,\
        \ INVALID_TRANSITION, VERSION_REQUIRED, VERSION_CONFLICT, REASON_REQUIRED\
        \  \n**상태 전이 사건**: PHONE_ACCEPTED, PHONE_PROCEED, PHONE_REJECTED_NEXT, PHONE_REJECTED_LAST,\
        \ PHONE_DISMISSED"
      operationId: post_transports__transportId__phone_checks
      security: *id009
      x-state-events:
      - PHONE_ACCEPTED
      - PHONE_PROCEED
      - PHONE_REJECTED_NEXT
      - PHONE_REJECTED_LAST
      - PHONE_DISMISSED
      x-error-codes:
      - NOT_FOUND
      - INVALID_TRANSITION
      - VERSION_REQUIRED
      - VERSION_CONFLICT
      - REASON_REQUIRED
      parameters:

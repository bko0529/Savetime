                version:
                  type: integer
                  description: 마지막으로 받은 version (SFR-160). 빠지면 400 VERSION_REQUIRED
                location:
                  allOf:
                  - $ref: '#/components/schemas/LatLng'
                  nullable: true
              required:
              - kind
              - version
      responses:
        '201':
          description: 성공

        (바뀐 칸 이름만, 값은 GET으로). 운전 역할이 주행 중(시속 10km 이상)이면 DRIVER_INPUT_LOCKED: 단말이 보낸\
        \ speedKmh, 없으면 진행 중 이송 건의 최근 15초 위치 기록 속도로 본다.\n\n**요구사항**: SFR-114, SFR-115\
        \  \n**화면**: S-04 환자 정보 입력  \n**오류 코드**: NOT_IN_TEAM, DRIVER_INPUT_LOCKED,\

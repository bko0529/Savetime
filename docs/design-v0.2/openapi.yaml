          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /transports/sync:
    post:
      tags:
      - 4. 이송 (대원 앱 · 핵심)
      summary: 통신 두절 중 기록 올리기
      description: "오프라인 기록은 조작한 단말 1대에서만 올린다. 승인 선택·취소·목적지 변경은 오프라인으로 남기지 않는다. 같은\
        \ 이송 건에 서버 쪽 유효 승인·확정이 있으면 history_only + 경보(SFR-099). create_fallback으로 만든\
        \ 건은 offlineCreated=true, fallbackReason=offline.\n\n처리: 보낸 순서대로 기록마다 트랜잭션을 따로 쓴다(한 건이 거절돼도 나머지는 계속).\
        \ create_fallback = 예비 추천 건 등록(병원 요청은 보내지 않음), 같은 ID면 duplicate, 팀에 다른 진행 중 건이 있으면 cancelled(offline_superseded)로 넣고 history_only.\
        \ phone_check = 온라인 전화 확인과 같은 함수로 반영(서버가 아직 전화 확인 중이 아니면 그 병원으로 시작, 대상이 다르면 대상만 바꿈).\
        \ 서버에 유효 승인(5분 안)이나 확정(이동 중)이 있거나 끝난 건이면 phone_check 행(offline)만 남기고 history_only. 같은 clientRecordId면 duplicate.\
        \ arrive = 이동 중이면 도착, 이미 도착이면 duplicate, 그 밖이면 이력만(history_only).\
        \ 판정은 DB 시각, 기록 시각(전화 결과·도착·생성)만 occurredAt을 이송 건 생성(도착은 출발)~지금 사이로 맞춰 쓴다.\
        \ 기록 하나가 상태 전이표·검사에 막히면 outcome rejected + code(예: REASON_REQUIRED, NOT_FOUND). 형식 오류는 요청 전체 400.\
        \ transport = 마지막 기록의 이송 건 최신 상태(복구 뒤 자동 재조회, SFR-068), 내 팀 건이 아니면 null.\n\n**요구사항**: SFR-099, SFR-068,\
        \ SFR-160  \n**화면**: S-11 오프라인 → 복구  \n**상태 전이 사건**: CREATE_NO_TARGET, PHONE_ACCEPTED,\
        \ PHONE_PROCEED, PHONE_REJECTED_NEXT, PHONE_REJECTED_LAST, PHONE_DISMISSED,\
        \ ARRIVE"
      operationId: post_transports_sync
      security: *id009
      x-state-events:
      - CREATE_NO_TARGET
      - PHONE_ACCEPTED
      - PHONE_PROCEED
      - PHONE_REJECTED_NEXT
      - PHONE_REJECTED_LAST
      - PHONE_DISMISSED
      - ARRIVE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                records:
                  type: array
                  items:
                    type: object
                    properties:
                      clientRecordId:
                        type: string
                        format: uuid
                        description: 기록마다 앱이 만든 값 → 같은 기록 두 번 반영 안 됨
                      kind:
                        type: string
                        enum:
                        - create_fallback
                        - phone_check
                        - arrive
                      transportId:
                        type: string
                        format: uuid
                      occurredAt:
                        type: string
                        format: date-time
                        description: 단말 시각
                      assessment:
                        allOf:
                        - $ref: '#/components/schemas/Assessment'
                        description: create_fallback일 때
                      radiusKm:
                        type: integer
                        enum:
                        - 10
                        - 20
                        - 30
                        - 40
                      location:
                        $ref: '#/components/schemas/LatLng'
                      hospitalId:
                        type: integer
                        nullable: true
                      result:
                        type: string
                        enum:
                        - accepted
                        - no_answer
                        - skipped
                        - rejected
                        - dismissed
                        nullable: true
                      reason:
                        type: string
                        enum: *id012
                        nullable: true
                        description: phone_check no_answer·skipped 사유 (필수)
                      reasonText:
                        type: string
                        maxLength: 30
                        nullable: true
                        description: phone_check '기타' 글 (거절 '기타'는 20자)
                      rejectReason:
                        type: string
                        enum:
                        - er_bed
                        - or_room
                        - ward
                        - icu
                        - no_specialist
                        - equipment
                        - etc
                        nullable: true
                        description: phone_check 거절 사유 (선택, SFR-044)
                      method:
                        type: string
                        enum:
                        - button
                        - menu
                        nullable: true
                        description: arrive일 때
                    required:
                    - clientRecordId
                    - kind
                    - transportId
                    - occurredAt
                  description: 발생 순서대로
              required:
              - records
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        clientRecordId:
                          type: string
                        outcome:
                          type: string
                          enum:
                          - applied
                          - history_only
                          - duplicate
                          - rejected
                        code:
                          type: string
                          description: rejected일 때 오류 코드
                          nullable: true
                  transport:
                    allOf:
                    - $ref: '#/components/schemas/Transport'
                    nullable: true
                    description: 반영 후 최신 상태
                  alert:
                    type: boolean
                    description: 서버에 유효한 승인·확정이 있어 이력으로만 남김 → 경보
        4XX:
          description: 오류 (코드는 오류 코드표)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

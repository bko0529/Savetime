  /transports/{transportId}/confirm:
    post:
      tags:
      - 4. 이송 (대원 앱 · 핵심)
      summary: 승인 병원 확정
      description: "Idempotency-Key 헤더 필수. 첫 시도가 서버에 도착한 시각으로 5분을 판정. 성공하면 나머지 대기·승인 요청은 닫히고(other_hospital) 경로 안내 담당 단말을 정한다(운전 단말 10초).\n\n**요구사항**: SFR-111, SFR-134, SFR-160, SFR-125  \n**화면**: S-05\
        \ 확정 확인  \n**오류 코드**: NOT_FOUND, INVALID_TRANSITION, VERSION_REQUIRED, VERSION_CONFLICT, APPROVAL_EXPIRED, APPROVAL_CANCELLED, REQUEST_NOT_APPROVED  \n**상태 전이 사건**: CONFIRM"

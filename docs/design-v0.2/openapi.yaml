                      assessment:
                        allOf:
                        - $ref: '#/components/schemas/Assessment'
                        description: create_fallback일 때
                      radiusKm:
                        type: integer
                        enum:
                        - 10
                        - 20
                        - 30
                        - 40
                      location:
                        $ref: '#/components/schemas/LatLng'
                      hospitalId:
                        type: integer
                        nullable: true
                      result:
                        type: string
                        enum:
                        - accepted
                        - no_answer
                        - skipped
                        - rejected
                        - dismissed
                        nullable: true
                      reason:
                        type: string
                        enum: *id012
                        nullable: true
                      method:
                        type: string
                        enum:
                        - button
                        - menu
                        nullable: true
                    required:
                    - clientRecordId
                    - kind
                    - transportId
                    - occurredAt
                  description: 발생 순서대로
              required:
              - records
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        clientRecordId:
                          type: string
                        outcome:
                          type: string
                          enum:
                          - applied
                          - history_only
                          - duplicate
                          - rejected
                        code:
                          type: string
                          description: rejected일 때 오류 코드
                          nullable: true
                  transport:
                    allOf:
                    - $ref: '#/components/schemas/Transport'
                    nullable: true
                    description: 반영 후 최신 상태
                  alert:
                    type: boolean
                    description: 서버에 유효한 승인·확정이 있어 이력으로만 남김 → 경보
        4XX:

openapi: 3.0.3
info:
  title: 세이브타임 API
  version: 0.3.0
  description: '세이브타임 서버 API v0.3 (Node.js/Express). 요구사항분석서 v1.4 · 상태 전이표 v0.2 ·
    DB 스키마 v0.2 · 실시간 통신 설계 v0.2 기준.


    **공통 규칙**

    - 기본 주소: `/api/v1` · 형식: JSON (가입 신청·재신청만 multipart)

    - 시간: ISO 8601, 모두 **서버 시각**. 모든 응답 헤더에 `X-Server-Now`, 시간이 중요한 응답 본문에는 `serverNow`.
    2분·5분은 서버 수신 시각으로 판정

    - 인증: 대원·관리자 = `Authorization: Bearer <accessToken>`(15분) + refreshToken(근무 종료
    때 폐기, 최대 14시간) / 병원 웹 = 등록 PC 쿠키 `st_pc`(httpOnly · Secure · SameSite=Strict)

    - **계정 상태는 요청마다 확인** (정지·탈퇴·PC 해제 후 10초 안 모든 요청 거부, SER-016). 토큰이 살아 있어도 401·403

    - 병원·관리자 웹: 상태를 바꾸는 요청은 `Origin` 헤더가 허용 목록일 때만 (CSRF 방어)

    - 구급대원 웹앱(CR-010): 대원 API는 `APP_ORIGINS`에 있는 주소에만 CORS 허용(쿠키 없음, `X-Server-Now` 노출).
    `/hw`·`/admin`에는 CORS 없음

    - 관리자 API(`/admin/*`)는 관리자 서버에서만 열림(T-11). 허용 IP(`ADMIN_ALLOWED_IPS`)가 아니면 로그인부터 403 `IP_NOT_ALLOWED`

    - **내 것이 아니면 404**: 다른 팀 이송 건, 다른 병원 요청, 남의 초대·메모 (SER-010·013)

    - 상태 변경: 상태 전이표 v0.2의 전이 함수를 거친다. 사용자 요청에는 `version` 필수(SFR-160). 검사 순서 = 표 →
    상태 → 시간·사유 → 버전. 실패하면 409와 `error.details.current`(최신 상태)

    - 확정은 `Idempotency-Key` 헤더, 이송 건 생성은 앱 UUID, 오프라인 기록은 `clientRecordId`로 중복 방지

    - 목록은 `limit`·`cursor`로 나눠 받음 (`nextCursor`)

    - 오류 형식: `{"error": {"code": "...", "message": "...", "details": {...}}}`

    - 각 API의 `x-state-events`는 거치는 상태 전이 사건 이름 (stateMachine.ts)

    - 실시간 알림(웹소켓 이벤트)은 실시간 통신 설계 v0.2·events.ts에서 정의. 이벤트에는 환자 정보가 없으니 받으면 이 API로
    상세를 가져온다

    '
servers:
- url: https://api.savetime.example/api/v1
  description: 운영(시연)
- url: http://localhost:4000/api/v1
  description: 개발
tags:
- name: 1. 대원 인증·계정
- name: 2. 팀
- name: 3. 병원 정보·위치 (대원 앱)
- name: 4. 이송 (대원 앱 · 핵심)
- name: 5. 병원 웹
- name: 6. 관리자 웹
paths:
  /health:
    get:
      servers:
      - url: /
        description: 운영 점검용. /api/v1 밖
      summary: 서버 상태 점검
      description: 로드밸런서와 외부 상태 점검이 쓴다. DB·Redis 연결을 확인하고 하나라도 실패하면 503 (QUR-009, COR-016)
      operationId: getHealth
      security: []
      responses:
        '200':
          description: 정상
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: DB 또는 Redis 연결 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /agencies/{code}:
    get:
      tags:
      - 1. 대원 인증·계정
      summary: 소속기관 코드 확인
      description: "**요구사항**: SFR-017  \n**화면**: S-02 가입 신청  \n**오류 코드**: AGENCY_NOT_FOUND"
      operationId: get_agencies__code
      security: &id001 []
      x-error-codes:
      - AGENCY_NOT_FOUND
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  name:
                    type: string
        4XX:
          description: 오류 (코드는 오류 코드표)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/signup:
    post:
      tags:
      - 1. 대원 인증·계정
      summary: 가입 신청 (공무원증 사진)
      description: "관리자 알림 '신규 가입 신청'이 생긴다. 사진은 jpg·png 1장 5MB 이하(파일 앞부분으로 확인), 서버가 AES-256-GCM으로\
        \ 암호화해 객체 저장소에 올린다(원본은 디스크·로그에 남기지 않음). DB 저장이 실패하면 올린 사진을 지운다. 비밀번호 8자 이상,\
        \ 아이디 영문·숫자·._- 4~40자. 같은 주소에서 10분에 5번까지(429).\n\n**요구사항**: SFR-017, SER-015, DAR-012\
        \  \n**화면**: S-02 가입 신청  \n**오류 코드**: VALIDATION_FAILED, AGENCY_NOT_FOUND,\
        \ LOGIN_ID_TAKEN, CONSENT_REQUIRED, TOO_MANY_REQUESTS, PHOTO_STORAGE_UNAVAILABLE"
      operationId: post_auth_signup
      security: *id001
      x-error-codes:
      - VALIDATION_FAILED
      - AGENCY_NOT_FOUND
      - LOGIN_ID_TAKEN
      - CONSENT_REQUIRED
      - TOO_MANY_REQUESTS
      - PHOTO_STORAGE_UNAVAILABLE
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                agencyCode: &id002
                  type: string
                loginId:
                  type: string
                password:
                  type: string
                name: &id003
                  type: string
                rank: &id004
                  type: string
                safetyCenter: &id005
                  type: string
                employeeNo: &id006
                  type: string
                photo: &id007
                  type: string
                  format: binary
                  description: 공무원증 사진 (승인·반려 즉시 삭제)
                photoConsent: &id008
                  type: boolean
                  description: 필수, true여야 함
              required:
              - agencyCode
              - loginId
              - password
              - name
              - rank
              - safetyCenter
              - employeeNo
              - photo
              - photoConsent
      responses:
        '201':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - pending
                  appliedAt:
                    type: string
                    format: date-time
        4XX:
          description: 오류 (코드는 오류 코드표)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /me/signup:
    put:
      tags:
      - 1. 대원 인증·계정
      summary: 반려 후 다시 신청
      description: "me.status가 rejected일 때만. 반려 사유(me.rejectReason)를 보고 고쳐서 다시 낸다\
        \ → pending.\n\n**요구사항**: SFR-083, SFR-017  \n**화면**: S-02 승인 대기  \n**오류 코드**:\
        \ SIGNUP_NOT_REJECTED, CONSENT_REQUIRED, AGENCY_NOT_FOUND"
      operationId: put_me_signup
      security: &id009
      - paramedicAuth: []
      x-error-codes:
      - SIGNUP_NOT_REJECTED
      - CONSENT_REQUIRED
      - AGENCY_NOT_FOUND
      - VALIDATION_FAILED
      - PHOTO_STORAGE_UNAVAILABLE
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                agencyCode: *id002
                name: *id003
                rank: *id004
                safetyCenter: *id005
                employeeNo: *id006
                photo: *id007
                photoConsent: *id008
              required:
              - agencyCode
              - name
              - rank
              - safetyCenter
              - employeeNo
              - photo
              - photoConsent
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        4XX:
          description: 오류 (코드는 오류 코드표)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/login:
    post:
      tags:
      - 1. 대원 인증·계정
      summary: 로그인
      description: "5번 틀리면 10분 잠금(ACCOUNT_LOCKED, details.retryAfterSeconds = 남은 초). 정지 여부는 비밀번호가\
        \ 맞을 때만 알려 준다. 승인 대기·반려 계정도 로그인은 되며 me.status로 '승인 대기 중'·'반려'\
        \ 화면만 연다 (SFR-022·083).\n\n**요구사항**: SFR-018, SER-011  \n**화면**: S-02 로그인\
        \  \n**오류 코드**: INVALID_CREDENTIALS, ACCOUNT_LOCKED, ACCOUNT_SUSPENDED"
      operationId: post_auth_login
      security: *id001
      x-error-codes:
      - INVALID_CREDENTIALS
      - ACCOUNT_LOCKED
      - ACCOUNT_SUSPENDED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                loginId:
                  type: string
                password:
                  type: string
                deviceId:
                  type: string
                  description: 앱 설치마다 고유
              required:
              - loginId
              - password
              - deviceId
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  tokens:
                    $ref: '#/components/schemas/Tokens'
                  me:
                    $ref: '#/components/schemas/Me'
        4XX:
          description: 오류 (코드는 오류 코드표)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/refresh:
    post:
      tags:
      - 1. 대원 인증·계정
      summary: 토큰 재발급
      description: "**요구사항**: SER-016  \n**화면**: (모든 화면)  \n**오류 코드**: TOKEN_REVOKED,\
        \ TOKEN_EXPIRED, ACCOUNT_SUSPENDED"
      operationId: post_auth_refresh
      security: *id001
      x-error-codes:
      - TOKEN_REVOKED
      - TOKEN_EXPIRED
      - ACCOUNT_SUSPENDED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
              required:
              - refreshToken
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
        4XX:
          description: 오류 (코드는 오류 코드표)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/logout:
    post:
      tags:
      - 1. 대원 인증·계정
      summary: 로그아웃 (팀에서 빠짐)
      description: "팀에 진행 중 이송이 있는데 confirmCancelActive가 없으면 409 + details.activeTransport{id,status,hospitalName}.\
        \ 확인 후 내가 마지막 1명이면 이송 건을 취소(logout)로 끝내고 열린·확정 병원 요청을 닫고 팀을 해제한다.\
        \ 근무 종료와 같은 처리이며, 다른 기기의 토큰까지 모두 끊는다(SER-016). 승인 전 계정도 쓸 수 있다.\n\n**요구사항**: SFR-070, SFR-113  \n\
        **화면**: S-12 설정  \n**오류 코드**: ACTIVE_TRANSPORT_CONFIRM_REQUIRED  \n**상태 전이\
        \ 사건**: CANCEL"
      operationId: post_auth_logout
      security: *id009
      x-state-events:
      - CANCEL
      x-error-codes:
      - ACTIVE_TRANSPORT_CONFIRM_REQUIRED
      parameters:
      - &id010
        name: confirmCancelActive
        in: query
        required: false
        schema:
          type: boolean
        description: 팀에 진행 중 이송이 있을 때 경고를 보고 '확인'을 눌렀으면 true (SFR-113)
      responses:
        '204':
          description: 성공 (본문 없음)
        4XX:
          description: 오류 (코드는 오류 코드표)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /me:
    get:
      tags:
      - 1. 대원 인증·계정
      summary: 내 정보
      description: "앱을 다시 열 때 이 응답으로 화면을 정한다 (근무 중이면 로그인을 묻지 않음).\n\n**요구사항**: SFR-018, SFR-022, SFR-083\
        \  \n**화면**: S-02 승인 대기 · 앱 시작"
      operationId: get_me
      security: *id009
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        4XX:
          description: 오류 (코드는 오류 코드표)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
      - 1. 대원 인증·계정
      summary: 회원 탈퇴
      description: "탈퇴는 막지 않는다. 진행 중 이송이 있으면 확인을 받고, 마지막 1명이면 이송 건을 취소(withdrawal)로\
        \ 끝낸 뒤 계정·프로필 즉시 삭제.\n\n**요구사항**: SFR-071, SFR-113  \n**화면**: S-12 설정  \n\
        **오류 코드**: ACTIVE_TRANSPORT_CONFIRM_REQUIRED  \n**상태 전이 사건**: CANCEL"
      operationId: delete_me
      security: *id009
      x-state-events:
      - CANCEL
      x-error-codes:
      - ACTIVE_TRANSPORT_CONFIRM_REQUIRED
      parameters:
      - *id010
      responses:
        '204':
          description: 성공 (본문 없음)
        4XX:
          description: 오류 (코드는 오류 코드표)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /me/password:
    put:
      tags:
      - 1. 대원 인증·계정
      summary: 비밀번호 변경 (임시 비밀번호 후 필수)
      description: "**요구사항**: SFR-021  \n**화면**: (비밀번호 변경)  \n**오류 코드**: INVALID_CREDENTIALS,\
        \ VALIDATION_FAILED"
      operationId: put_me_password
      security: *id009
      x-error-codes:
      - INVALID_CREDENTIALS
      - VALIDATION_FAILED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
              required:
              - currentPassword
              - newPassword
      responses:
        '204':
          description: 성공 (본문 없음)
        4XX:
          description: 오류 (코드는 오류 코드표)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /me/push-device:
    put:
      tags:
      - 1. 대원 인증·계정
      summary: 푸시 토큰 등록
      description: "web은 구급대원 웹앱의 브라우저 푸시 토큰(FCM 웹, CR-010).\n\n**요구사항**: SFR-130, COR-009, CR-010  \n**화면**: 앱 시작"
      operationId: put_me_push_device
      security: *id009
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId:
                  type: string
                platform:
                  type: string
                  enum:
                  - android
                  - ios
                  - web
                fcmToken:
                  type: string
              required:
              - deviceId
              - platform
              - fcmToken
      responses:
        '204':
          description: 성공 (본문 없음)
        4XX:
          description: 오류 (코드는 오류 코드표)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /teams:
    post:
      tags:
      - 2. 팀
      summary: 팀 만들기 (근무 시작)
      description: "14시간 자동 근무 종료 타이머가 걸린다.\n\n**요구사항**: SFR-113  \n**화면**: S-03 근무\
        \ 시작  \n**오류 코드**: ALREADY_IN_TEAM, NOT_APPROVED"
      operationId: post_teams
      security: *id009
      x-error-codes:
      - ALREADY_IN_TEAM
      - NOT_APPROVED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum:
                  - driver
                  - care
              required:
              - role
      responses:
        '201':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        4XX:
          description: 오류 (코드는 오류 코드표)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /teams/join:
    post:
      tags:
      - 2. 팀
      summary: 코드·QR로 참여
      description: "code와 qrToken 중 하나만 보낸다. 운전은 팀에 1명. 이 시점 이후 이벤트만 받는다(joined_seq).\n\
        \n**요구사항**: SFR-113  \n**화면**: S-03 근무 시작  \n**오류 코드**: TEAM_NOT_FOUND, TEAM_FULL,\
        \ DRIVER_TAKEN, ALREADY_IN_TEAM"
      operationId: post_teams_join
      security: *id009
      x-error-codes:
      - TEAM_NOT_FOUND
      - TEAM_FULL
      - DRIVER_TAKEN
      - ALREADY_IN_TEAM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                qrToken:
                  type: string
                role:
                  type: string
                  enum:
                  - driver
                  - care
              required:
              - role
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        4XX:
          description: 오류 (코드는 오류 코드표)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /teams/current:
    get:
      tags:
      - 2. 팀
      summary: 내 팀 보기
      description: "**요구사항**: SFR-113  \n**화면**: S-03 근무 시작  \n**오류 코드**: NOT_IN_TEAM"
      operationId: get_teams_current
      security: *id009
      x-error-codes:
      - NOT_IN_TEAM
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'

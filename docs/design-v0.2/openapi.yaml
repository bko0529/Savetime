      description: "오프라인 기록은 조작한 단말 1대에서만 올린다. 승인 선택·취소·목적지 변경은 오프라인으로 남기지 않는다. 같은 이송 건에 서버 쪽 유효 승인·확정이 있으면 history_only + 경보(SFR-099). create_fallback으로 만든 건은 offlineCreated=true, fallbackReason=offline.\n\
        \n**요구사항**: SFR-099, SFR-068, SFR-160  \n**화면**: S-11 오프라인 → 복구  \n**상태 전이 사건**: CREATE_NO_TARGET, PHONE_ACCEPTED, PHONE_PROCEED, PHONE_REJECTED_NEXT, PHONE_REJECTED_LAST, PHONE_DISMISSED, ARRIVE"
      operationId: post_transports_sync
      security: *id009
      x-state-events:
      - CREATE_NO_TARGET
      - PHONE_ACCEPTED
      - PHONE_PROCEED
      - PHONE_REJECTED_NEXT
      - PHONE_REJECTED_LAST
      - PHONE_DISMISSED
      - ARRIVE
      requestBody:
        required: true
        content:

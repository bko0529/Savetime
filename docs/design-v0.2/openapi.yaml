      description: "진행 중 4상태 모두에서. 사유는 user로 기록. 병원 웹(확정 병원 포함)에 '이송 취소'.\
        \ 대원이 고른 미이송 사유(선택)는 구급활동일지 초안의 미이송 사유 칸이 된다(SFR-164).\n\n**요구사항**:\
        \ SFR-076, SFR-164  \n**화면**: S-05 · S-06 · S-08 · S-09  \n**오류 코드**: NOT_FOUND, INVALID_TRANSITION,\
        \ VERSION_REQUIRED, VERSION_CONFLICT  \n**상태 전이 사건**: CANCEL"
      operationId: post_transports__transportId__cancel

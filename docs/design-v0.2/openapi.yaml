        \ → 대원이 arrive(method=hospital). version은 병원 요청(hospital_request)의 version. 위치 동의 건인데\
        \ 위치 기록이 아직 없으면 판단할 수 없어 AMBULANCE_NOT_NEAR. 병원 웹에는 위치·거리를 주지 않는다. 근무 중인 PC만\
        \ (SHIFT_REQUIRED).\n\n**요구사항**: SFR-144  \n**화면**: H-03 도착 예정\
        \  \n**오류 코드**: NOT_FOUND, INVALID_TRANSITION, VERSION_REQUIRED, VERSION_CONFLICT,\
        \ AMBULANCE_NOT_NEAR, SHIFT_REQUIRED  \n**상태 전이 사건**: ARRIVE"
      operationId: post_hw_requests__requestId__confirm_arrival
      security: *id013
      x-state-events:
      - ARRIVE
      x-error-codes:
      - NOT_FOUND
      - INVALID_TRANSITION
      - VERSION_REQUIRED
      - VERSION_CONFLICT
      - SHIFT_REQUIRED
      - AMBULANCE_NOT_NEAR
      parameters:
      - *id016
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version:
                  type: integer
                  description: 마지막으로 받은 version (SFR-160). 빠지면 400 VERSION_REQUIRED
              required:
              - version
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    enum:
                    - arrived
                    - asked_paramedic
                    description: arrived = 바로 도착 처리 / asked_paramedic = 위치 없는 건이라
                      대원 앱에 확인 요청
        4XX:
          description: 오류 (코드는 오류 코드표)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /hw/requests/{requestId}/unacceptable:
    post:
      tags:
      - 5. 병원 웹
      summary: 도착 후 수용 불가 (10분 안)
      description: "대원 앱에 경보 transport.unacceptable {transportId, hospitalName, reason 코드} + 푸시('A병원\
        \ 수용 불가 · 해당 전문의 부재'). 기타 글(etcText)은 병원 요청에만 저장하고 이벤트·푸시에는 넣지 않는다. 이 병원은 직전 건을 이어\
        \ 쓰는 다음 이송에서 자동 제외(unacceptable_prev). 거절 원장에 출처 unacceptable 1줄(SFR-126·106). version은 병원\
        \ 요청 version. 근무 중인 PC만(SHIFT_REQUIRED).\n\n**요구사항**: SFR-158  \n**화면**: H-03 도착 예정  \n**오류\
        \ 코드**: NOT_FOUND, INVALID_TRANSITION, VERSION_REQUIRED, VERSION_CONFLICT,\
        \ WINDOW_PASSED, REASON_REQUIRED, SHIFT_REQUIRED  \n**상태 전이 사건**: UNACCEPTABLE"
      operationId: post_hw_requests__requestId__unacceptable
      security: *id013
      x-state-events:
      - UNACCEPTABLE
      x-error-codes:
      - NOT_FOUND
      - INVALID_TRANSITION
      - VERSION_REQUIRED
      - VERSION_CONFLICT
      - WINDOW_PASSED
      - REASON_REQUIRED
      - SHIFT_REQUIRED
      parameters:
      - *id016
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  enum:
                  - er_bed
                  - or_room
                  - ward
                  - icu
                  - no_specialist
                  - equipment
                  - etc
                  description: er_bed 응급실 병상 부족 · or_room 수술실 부족 · ward 입원실 부족 · icu
                    중환자실 부족 · no_specialist 해당 전문의 부재 · equipment 의료장비 고장(CT 등) ·
                    etc 기타(etcText 20자). 구급활동일지 재이송 사유와 대응 (요구사항 부록 G, D-115)
                etcText:
                  type: string
                  maxLength: 20
                  nullable: true
                version:
                  type: integer
                  description: 마지막으로 받은 version (SFR-160). 빠지면 400 VERSION_REQUIRED
              required:
              - reason
              - version
      responses:
        '204':
          description: 성공 (본문 없음)
        4XX:
          description: 오류 (코드는 오류 코드표)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

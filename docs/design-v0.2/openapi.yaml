  /transports:
    post:
      tags:
      - 4. 이송 (대원 앱 · 핵심)
      summary: 이송 건 만들기 + 병원에 동시 요청
      description: "요청 대상(반경 안 · 알림 켠 PC 있음 · 요청 중지 아님 · 제외 병원 아님 · requestedGrade를\
        \ 보냈으면 그 등급 이상)이 1곳 이상이면 status=requesting, request.new 전송. **0곳이면 오류가 아니라\
        \ 201 + status=fallback(fallbackReason=no_target)**. 팀에 진행 중 건이 있으면 409 ACTIVE_TRANSPORT_EXISTS\
        \ + details.activeTransport. 그 건이 moving이면 앱이 '이전 이송(○○병원)을 도착으로 끝내고 새로 요청할까요?'를\
        \ 묻고 finishPrevious=true로 다시 보낸다 → 같은 트랜잭션에서 이전 건 arrived(finish_previous).\
        \ 같은 id로 다시 보내면 처음 결과를 돌려준다. 통신 두절 시 앱은 이 API를 부르지 않는다 (SFR-109).\
        \ 보낸 환자 평가로 팀 작성 중 정보를 맞추고 draft.updated를 보낸다 ('변경 사항 보내기(n)'가 0에서 시작, SFR-105).\n\n**요구사항**:\
        \ SFR-109, SFR-162, SFR-104, SFR-129, SFR-157, SFR-161  \n**화면**: S-04 → S-05\
        \ 응답 대기 / S-06  \n**오류 코드**: ACTIVE_TRANSPORT_EXISTS, ASSESSMENT_INCOMPLETE,\
        \ NOT_IN_TEAM, VALIDATION_FAILED, INVALID_TRANSITION, VERSION_REQUIRED, VERSION_CONFLICT\
        \  \n**상태 전이 사건**: CREATE_WITH_TARGETS, CREATE_NO_TARGET, FINISH_PREVIOUS"
      operationId: post_transports
      security: *id009
      x-state-events:
      - CREATE_WITH_TARGETS
      - CREATE_NO_TARGET
      - FINISH_PREVIOUS
      x-error-codes:
      - ACTIVE_TRANSPORT_EXISTS
      - ASSESSMENT_INCOMPLETE
      - NOT_IN_TEAM
      - VALIDATION_FAILED
      - INVALID_TRANSITION
      - VERSION_REQUIRED
      - VERSION_CONFLICT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  description: 앱이 만든 UUID (중복 생성 방지)
                prevTransportId:
                  type: string
                  format: uuid
                  nullable: true

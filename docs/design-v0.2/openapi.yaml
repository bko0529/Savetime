          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /transports/{transportId}/nav-device:
    post:
      tags:
      - 4. 이송 (대원 앱 · 핵심)
      summary: 경로 안내 담당 단말 응답
      description: "확정 뒤 운전 단말이 10초 안에 부르면 담당이 된다. 10초가 지나 서버가 확정한 대원 단말로 넘겼으면 NAV_DEVICE_ASSIGNED(보기\
        \ 전용). 결과는 transport.nav_device.\n\n**요구사항**: SFR-132, SFR-133  \n**화면**:\
        \ S-09 경로 안내  \n**오류 코드**: NOT_FOUND, NAV_DEVICE_ASSIGNED, NOT_NAV_DEVICE, VERSION_REQUIRED, VERSION_CONFLICT,\
        \ INVALID_TRANSITION, VALIDATION_FAILED\n\n담당 정하기: 확정(confirm·전화 확인 수용) 때 팀에 운전 역할이 없거나 확정한 사람이 운전자면 그 단말이 바로 담당\
        \ (transport.confirmed.navDeviceId + transport.nav_device). 운전자가 따로 있으면 navDeviceId null로 두고 운전 단말을 10초(DB 시각) 기다린다.\
        \ 그 사이 운전 역할 대원만 자기 로그인 단말(deviceId)로 부를 수 있고(아니면 403 NOT_NAV_DEVICE, 남의 단말 ID면 400), 10초가 지나면\
        \ 서버 작업이 확정한 대원 단말로 넘긴다. 이미 담당이 있으면 같은 단말은 200(isMe true), 다른 단말은 409 NAV_DEVICE_ASSIGNED(details.navDeviceId).\
        \ 담당을 정하면 이송 건 version +1. 목적지 변경·다시 요청 뒤 다시 확정해도 담당은 그대로. 출발 전이면 409 INVALID_TRANSITION."
      operationId: post_transports__transportId__nav_device
      security: *id009
      x-error-codes:
      - NOT_FOUND
      - NAV_DEVICE_ASSIGNED
      - NOT_NAV_DEVICE
      - VERSION_REQUIRED
      - VERSION_CONFLICT
      - INVALID_TRANSITION
      - VALIDATION_FAILED
      parameters:
      - *id011
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId:
                  type: string
                version:
                  type: integer
                  description: 마지막으로 받은 version (SFR-160). 빠지면 400 VERSION_REQUIRED
              required:
              - deviceId
              - version
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  navDeviceId:
                    type: string
                  isMe:
                    type: boolean
                    description: false면 보기 전용
        4XX:
          description: 오류 (코드는 오류 코드표)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /transports/{transportId}/assessments:
    post:
      tags:
      - 4. 이송 (대원 앱 · 핵심)
      summary: 변경 사항 보내기
      description: "requesting·phone_check·moving에서. 팀 작성 중 정보와 마지막으로 보낸 값을 서버가 비교해 바뀐 것만 대기·승인·확정\
        \ 병원에 보낸다. baseSeq가 다르면(다른 팀원이 이미 보냄) VERSION_CONFLICT.\n\n**요구사항**: SFR-121,\
        \ SFR-105  \n**화면**: S-05 · S-09  \n**오류 코드**: NOT_FOUND, NOTHING_TO_SEND,\
        \ VERSION_REQUIRED, VERSION_CONFLICT, INVALID_TRANSITION, VALIDATION_FAILED  \n**상태 전이 사건**: ASSESSMENT_UPDATED\n\
        \n작성 중 정보 전체를 assessment 새 행(seq+1)으로 저장해 이전 행과 함께 전후 값·시각이 남는다. 이송 건 version은 그대로.\
        \ 받는 병원: 요청 중·전화 확인 중이면 2분 안 대기·5분 안 승인 병원(request.updated), 이동 중이면 확정 병원(incoming.updated).\
        \ 팀에는 assessment.sent. 이벤트에는 바뀐 칸 이름만. 주 증상을 지운 채면 400 VALIDATION_FAILED(chiefComplaint)."
      operationId: post_transports__transportId__assessments
      security: *id009
      x-state-events:
      - ASSESSMENT_UPDATED
      x-error-codes:
      - NOT_FOUND
      - NOTHING_TO_SEND
      - VERSION_REQUIRED
      - VERSION_CONFLICT
      - INVALID_TRANSITION
      - VALIDATION_FAILED
      parameters:
      - *id011
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                baseSeq:
                  type: integer
                  description: 마지막으로 보낸 seq (Transport.lastSentAssessmentSeq). 빠지면 400 VERSION_REQUIRED
              required:
              - baseSeq
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  seq:
                    type: integer
                  changedFields:
                    type: array
                    items:
                      type: string
        4XX:
          description: 오류 (코드는 오류 코드표)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /transports/{transportId}/locations:
    post:
      tags:
      - 4. 이송 (대원 앱 · 핵심)
      summary: 위치 올리기 (5초마다, 담당 단말만)
      description: "위치 미동의 건은 부르지 않는다. 출발(departed_at) 뒤 이송이 끝날 때까지만 받고(다시 요청으로 요청 중이어도 계속),\
        \ 그 밖이면 409 INVALID_TRANSITION. 담당 단말 1대만: 담당(nav_device_id, POST /nav-device로 정함)이 아닌 단말이거나\
        \ 아직 담당이 없으면(운전 단말 응답 대기 중) 403 NOT_NAV_DEVICE. 같은 recordedAt 재전송은 한 번만 저장, 출발 1분 전~지금+1분 밖은 버림.\
        \ 이송이 끝나면(도착·취소·이전 이송 끝내기) 익명 이송 경로(anonymous_route)로 옮기고 원본 즉시 삭제, 이송 건에는 distance_m만.\
        \ 입구 200m 안에 처음 들어오면 병원 웹에 incoming.near 한 번 (SFR-144). etaMin = 앱 안 내비(KNSDK)가 계산한\
        \ 남은 분, 1분마다 한 번 실어 보내면 된다. 보여 줄 값이 바뀔 때만 팀에 transport.eta, 병원에 incoming.updated\
        \ (SFR-121·132).\n\
        \n**요구사항**: SFR-037, SFR-079, SFR-039, SFR-041, SER-002  \n**화면**: S-09 경로 안내  \n**오류 코드**:\
        \ NOT_FOUND, NOT_NAV_DEVICE, INVALID_TRANSITION, VALIDATION_FAILED"
      operationId: post_transports__transportId__locations
      security: *id009
      x-error-codes:
      - NOT_FOUND
      - NOT_NAV_DEVICE
      - INVALID_TRANSITION
      - VALIDATION_FAILED
      parameters:
      - *id011
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId:
                  type: string
                points:
                  type: array
                  items:
                    type: object
                    properties:
                      lat:
                        type: number
                      lng:
                        type: number
                      speedKmh:
                        type: number
                      recordedAt:
                        type: string
                        format: date-time
                etaMin:
                  type: integer
                  minimum: 0
                  maximum: 600
                  description: 앱 안 내비가 계산한 남은 분 (선택). 보여 줄 때 서버가 받은 뒤 지난 분을 뺀다(2분 넘게 안 와도 줄어듦)
              required:
              - deviceId
              - points
      responses:
        '204':
          description: 성공 (본문 없음)
        4XX:
          description: 오류 (코드는 오류 코드표)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /transports/{transportId}/destination:
    post:
      tags:
      - 4. 이송 (대원 앱 · 핵심)
      summary: 목적지 변경 (이송 건당 1번)
      description: "moving → requesting. 새 병원을 고르는 API가 아니다: 이전 목적지는 닫힘(dest_changed)·제외\
        \ 병원, 현재 위치 기준 반경 안 병원에 새 회차(dest_change). 경로 안내 유지, 소요시간은 처음 출발 시각 기준. 이미\
        \ 바꿨으면 '이송 취소 후 새로 요청' 안내.\n\n**요구사항**: SFR-077, SFR-156  \n**화면**: S-09 경로\
        \ 안내  \n**오류 코드**: NOT_FOUND, INVALID_TRANSITION, VERSION_REQUIRED, VERSION_CONFLICT,\
        \ DESTINATION_CHANGE_USED, REASON_REQUIRED, NO_REQUEST_TARGET, LOCATION_REQUIRED, VALIDATION_FAILED\
        \  \n**상태 전이 사건**: CHANGE_DESTINATION\n\nlocation이 없으면 출발 위치 기준. 확정 병원(confirmed_hospital_id)은\
        \ 비우고 이전 목적지·사유·시각(dest_changed_*)을 남긴다. 새 대상이 0곳이면 422 NO_REQUEST_TARGET이고 아무것도 바뀌지\
        \ 않는다."
      operationId: post_transports__transportId__destination
      security: *id009
      x-state-events:
      - CHANGE_DESTINATION
      x-error-codes:
      - NOT_FOUND
      - INVALID_TRANSITION
      - VERSION_REQUIRED
      - VERSION_CONFLICT
      - DESTINATION_CHANGE_USED
      - REASON_REQUIRED
      - NO_REQUEST_TARGET
      - LOCATION_REQUIRED
      - VALIDATION_FAILED
      parameters:
      - *id011
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  enum:
                  - patient_change
                  - road
                  - hospital
                  - etc
                version:
                  type: integer
                  description: 마지막으로 받은 version (SFR-160). 빠지면 400 VERSION_REQUIRED
                location:
                  allOf:
                  - $ref: '#/components/schemas/LatLng'
                  nullable: true
              required:
              - reason
              - version
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transport'
        4XX:
          description: 오류 (코드는 오류 코드표)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /transports/{transportId}/arrive:
    post:
      tags:
      - 4. 이송 (대원 앱 · 핵심)
      summary: 도착 처리
      description: "원본 위치 삭제, 익명 소요시간만 저장. 10분 동안 팀 작성 중 정보에 이번 환자 정보를 남긴다 (SFR-157).\n\
        \n**요구사항**: SFR-038, SFR-080, SFR-039, SFR-144  \n**화면**: S-10 도착 처리  \n**오류\
        \ 코드**: NOT_FOUND, INVALID_TRANSITION, VERSION_REQUIRED, VERSION_CONFLICT\
        \  \n**상태 전이 사건**: ARRIVE"
      operationId: post_transports__transportId__arrive

      description: "expand (fallback→requesting): 반경 한 단계, 이번 이송에서 아직 요청하지 않은 병원에만.\
        \ 대상 0곳이면 422 NO_REQUEST_TARGET(상태 그대로). re_request (moving→requesting): 확정\
        \ 병원이 승인 취소한 경우만, 현재 위치 기준·현재 반경, 제외 병원만 빼고, 직전 승인 병원에 '재확인' 표시. 경로 안내 유지.\n\
        \n**요구사항**: SFR-131, SFR-128, SFR-156  \n**화면**: S-06 · S-09 승인 취소 경보  \n\
        **오류 코드**: NOT_FOUND, INVALID_TRANSITION, VERSION_REQUIRED, VERSION_CONFLICT,\
        \ NO_REQUEST_TARGET, MAX_RADIUS, RE_REQUEST_NOT_ALLOWED  \n**상태 전이 사건**: EXPAND_ROUND,\
        \ RE_REQUEST"
      operationId: post_transports__transportId__rounds
      security: *id009
      x-state-events:
      - EXPAND_ROUND
      - RE_REQUEST
      x-error-codes:
      - NOT_FOUND
      - INVALID_TRANSITION
      - VERSION_REQUIRED
      - VERSION_CONFLICT
      - NO_REQUEST_TARGET
      - MAX_RADIUS
      - RE_REQUEST_NOT_ALLOWED

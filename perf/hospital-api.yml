# 병원 웹 REST 연습: 병원 PC 가 다시 연결될 때마다 부르는 API(현재 PC 정보, 요청 목록)를 반복 호출한다.
# 실시간 설계 3장: 새 요청 알림을 받거나 다시 붙으면 GET /hw/requests 로 전체를 새로 받는다 → 동시에 몰릴 수 있는 호출
# 연습(S1, 내 컴퓨터): 초당 5명 → 20명으로 늘리며 1분, 각자 두 API 를 3번씩
#
# 실행: perf/README.md 참고
#   npx artillery@2.0.34 run perf/hospital-api.yml
config:
  target: "{{ $env.PERF_TARGET }}"
  payload:
    path: "./.pcs.csv"
    fields: ["cookie"]
    order: sequence
    skipHeader: true
  phases:
    - name: 몸풀기
      duration: 20
      arrivalRate: 5
    - name: 늘리기
      duration: 40
      arrivalRate: 5
      rampTo: 20
  plugins:
    ensure: {}
  # p95 가 목표를 넘으면 실패로 끝낸다. S1 연습 값이라 느슨하게 두고, S8 에서 PER-001 기준으로 조인다
  ensure:
    thresholds:
      - http.response_time.p95: 500
    conditions:
      - expression: "http.codes.200 > 0"

scenarios:
  - name: 병원 PC 가 세션·요청 목록을 새로 받음
    flow:
      - loop:
          # 쿠키는 가상 사용자(PC)마다 다르다. 공통 기본값(defaults)에서는 사용자별 값이 안 채워져서 요청마다 붙인다
          - get:
              url: /api/v1/hw/session
              headers: &pc
                Cookie: "{{ cookie }}"
                Origin: "{{ $env.PERF_ORIGIN }}"
          - get:
              url: /api/v1/hw/requests
              headers: *pc
          - think: 1
        count: 3

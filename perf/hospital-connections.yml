# PER-005 연습: 병원 PC 실시간 연결을 동시에 많이 맺고 유지한다.
# 목표(S8, 클라우드): 동시 연결 5,000개 (병원 PC 약 1,230 + 대원 앱 약 3,300 + 여유)
# 연습(S1, 내 컴퓨터): PC 200대가 20초에 걸쳐 붙고 각각 60초 유지 → 최대 동시 연결 약 200개
#
# 실행: perf/README.md 참고
#   npx artillery@2.0.34 run perf/hospital-connections.yml
config:
  target: "{{ $env.PERF_TARGET }}"
  processor: "./processor.mjs"
  # PC 쿠키(.pcs.csv)는 processor.mjs 의 pickPc 가 PC 마다 한 줄씩 나눠 준다 (config.payload 는 작업자마다 겹친다)
  phases:
    - name: 연결 늘리기
      duration: 20
      arrivalRate: 10
  variables:
    # 연결 유지 시간(초). S8 에서는 늘린다
    holdSeconds: 60

before:
  flow:
    - function: newRun

scenarios:
  - name: 병원 PC 1대가 붙어서 유지
    beforeScenario: pickPc
    flow:
      - function: connectHospital
      - think: "{{ holdSeconds }}"
      - function: disconnectHospital
